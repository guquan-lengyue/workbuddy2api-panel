<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeArts 接入 · WorkBuddy2API</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f6f8; --card:#fff; --ink:#1b1f27; --muted:#687083; --line:#e3e6ec; --accent:#3d5fe0; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --card:#171b23; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2a3140; --accent:#7c93ff; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  label { display:block; color:var(--muted); font-size:12px; margin:10px 0 4px; }
  input[type=number], input[type=text] { width:100%; max-width:220px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); }
  input[type=checkbox] { width:18px; height:18px; vertical-align:middle; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:7px 12px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  .row { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:end; }
  .row > div { min-width:150px; }
  .actions { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .muted { color:var(--muted); }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; border:1px solid var(--line); font-size:12px; }
  .pill.ok { color:#1f8a5b; border-color:#1f8a5b55; }
  .pill.bad { color:var(--bad); border-color:#c0392b55; }
  a { color:var(--accent); }
  #oauthBox { display:none; margin-top:12px; padding:12px; border:1px dashed var(--line); border-radius:8px; }
  #oauthBox a { word-break: break-all; }
  #msg { margin-top:10px; color:var(--muted); white-space:pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CodeArts 接入</h1>
  <div class="sub">华为云 CodeArts（盘古助手 / 码道）第三上游 · <a href="/panel/">返回面板</a></div>

  <div class="card">
    <h2>出口设置</h2>
    <div class="row">
      <div><label>启用 CodeArts 出口</label><input id="enabled" type="checkbox"></div>
      <div><label>普通超时（秒）</label><input id="timeout" type="number" min="1" max="600"></div>
      <div><label>流式超时（秒）</label><input id="stream_timeout" type="number" min="1" max="3600"></div>
      <div><label>模型缓存（秒）</label><input id="models_ttl" type="number" min="60" max="86400"></div>
      <div><label>单账号并发</label><input id="max_concurrent" type="number" min="1" max="20"></div>
      <div><label>忙时排队（秒）</label><input id="busy_wait" type="number" min="0" max="120"></div>
      <div><label>自动领福利</label><input id="benefit_auto_claim" type="checkbox"></div>
    </div>
    <div class="actions"><button class="primary" id="save">保存设置</button></div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>账号</h2>
    <div class="actions">
      <button class="primary" id="add">+ 添加账号（OAuth）</button>
      <button id="refresh_models">刷新模型目录</button>
      <button id="reload">刷新本页</button>
    </div>
    <div id="oauthBox"></div>
    <table>
      <thead><tr><th>账号</th><th>状态</th><th>令牌</th><th>模型</th><th>并发</th><th>操作</th></tr></thead>
      <tbody id="accounts"></tbody>
    </table>
    <p class="muted" id="modelInfo"></p>
  </div>
</div>
<script src="/panel/codearts.js"></script>
</body>
</html>
